<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#171021"/><stop offset=".48" stop-color="#322044"/><stop offset="1" stop-color="#6D4B85"/>
  </linearGradient>
  <linearGradient id="accent" x1="90" y1="40" x2="1080" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E7D9F5"/><stop offset=".48" stop-color="#BFA7D9"/><stop offset="1" stop-color="#8A64A6"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#090510" flood-opacity=".45"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#E7D9F5" stroke-opacity=".07"/></pattern>
  <style>
    .float{animation:float 7s ease-in-out infinite}
    .float2{animation:float 9s ease-in-out infinite reverse}
    .spin{transform-origin:600px 180px;animation:spin 24s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-10px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{50%{opacity:.5}}
  </style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="170" cy="40" r="120" fill="#8A64A6" opacity=".22" filter="url(#blur)"/>
<circle cx="1050" cy="300" r="140" fill="#BFA7D9" opacity=".18" filter="url(#blur)"/>
<g class="spin" opacity=".32"><ellipse cx="600" cy="180" rx="470" ry="104" stroke="#E7D9F5" stroke-width="1"/><ellipse cx="600" cy="180" rx="370" ry="72" stroke="#E7D9F5" stroke-width="1"/></g>
<g class="float">
  <rect x="82" y="74" width="58" height="58" rx="16" fill="#E7D9F5" fill-opacity=".12" stroke="#E7D9F5" stroke-opacity=".35"/>
  <path d="M101 95l10 8-10 8M119 111h10" stroke="#E7D9F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g class="float2">
  <rect x="1036" y="66" width="82" height="82" rx="22" fill="#E7D9F5" fill-opacity=".10" stroke="#E7D9F5" stroke-opacity=".3"/>
  <circle cx="1077" cy="107" r="22" stroke="#E7D9F5" stroke-width="2"/><path d="M1064 107h26M1077 94v26" stroke="#E7D9F5" stroke-width="2"/>
</g>
<g filter="url(#shadow)">
  <rect x="250" y="70" width="700" height="220" rx="26" fill="#120B1C" fill-opacity=".56" stroke="url(#accent)" stroke-opacity=".55"/>
  <circle cx="288" cy="106" r="6" fill="#BFA7D9"/><circle cx="308" cy="106" r="6" fill="#8A64A6"/><circle cx="328" cy="106" r="6" fill="#E7D9F5" fill-opacity=".65"/>
  <path d="M280 130H920" stroke="#E7D9F5" stroke-opacity=".13"/>
  <text x="600" y="185" text-anchor="middle" fill="#F8F3FC" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" letter-spacing="6">RYAN DALCIN</text>
  <text x="600" y="222" text-anchor="middle" fill="#D9C9E8" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="3">TI  •  WEB  •  AUTOMAÇÃO  •  INFRAESTRUTURA</text>
  <rect x="486" y="248" width="228" height="2" rx="1" fill="url(#accent)" class="pulse"/>
</g>
<circle cx="164" cy="270" r="3" fill="#E7D9F5" class="pulse"/><circle cx="1024" cy="226" r="3" fill="#E7D9F5" class="pulse"/>
</svg>